name: Build and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-2022
            arch: win64_msvc2022_64
            preset: windows-msvc
          - name: macOS arm64
            os: macos-15
            arch: clang_64
            preset: macos-release
          - name: macOS x86_64
            os: macos-15-intel
            arch: clang_64
            preset: macos-release
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125 # v4
        with:
          version: '6.10.2'
          arch: ${{ matrix.arch }}
          cache: true
      - name: Configure
        shell: bash
        env:
          TILO_QT: ${{ env.QT_ROOT_DIR }}
        run: cmake --preset ${{ matrix.preset }}
      - name: Build
        shell: bash
        run: cmake --build --preset ${{ matrix.preset }} --parallel 4
      - name: Test
        shell: bash
        run: ctest --preset ${{ matrix.preset }}
      - name: QML lint
        shell: bash
        run: cmake --build --preset ${{ matrix.preset }} --target tilo_qmllint tilo_style_qmllint

  checks:
    name: Repository checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750db5838078e36cf38b85af677262 # v4
      - name: Colour contrast audit
        run: python3 scripts/check-ui-colors.py
      - name: Documentation links
        shell: pwsh
        run: ./scripts/check-docs.ps1