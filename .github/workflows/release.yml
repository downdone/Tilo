name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (must match CMakeLists TILO_VERSION)'
        required: true

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-2022
            arch: win64_msvc2022_64
            preset: windows-msvc
          - name: macos-arm64
            os: macos-15
            arch: clang_64
            preset: macos-release
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125 # v4
        with:
          version: '6.10.2'
          arch: ${{ matrix.arch }}
          cache: true
      - name: Configure
        shell: bash
        env:
          TILO_QT: ${{ env.QT_ROOT_DIR }}
        run: cmake --preset ${{ matrix.preset }}
      - name: Build
        shell: bash
        run: cmake --build --preset ${{ matrix.preset }} --parallel 4
      - name: Test
        shell: bash
        run: ctest --preset ${{ matrix.preset }}

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $root = "dist/Tilo-${{ github.ref_name }}-windows-x64"
          New-Item -ItemType Directory -Path $root -Force | Out-Null
          Copy-Item build/windows-msvc/bin/tilo.exe $root
          $env:PATH = "${{ env.QT_ROOT_DIR }}/bin;$env:PATH"
          & "${{ env.QT_ROOT_DIR }}/bin/windeployqt.exe" --release --qmldir src/ui --no-translations (Join-Path $root 'tilo.exe')
          if ($LASTEXITCODE -ne 0) { throw 'windeployqt failed' }
          Copy-Item docs $root -Recurse
          Copy-Item LICENSE $root
          Compress-Archive -Path $root -DestinationPath "$root.zip" -CompressionLevel Optimal
          Get-FileHash "$root.zip" -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLowerInvariant())  Tilo-${{ github.ref_name }}-windows-x64.zip" } | Set-Content "$root.zip.sha256"

      - name: Package (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          app="build/macos-release/bin/tilo.app"
          test -d "$app"
          "${TILO_QT}/bin/macdeployqt" "$app" -always-overwrite
          ditto -c -k --sequesterRsrc --keepParent "$app" "Tilo-${GITHUB_REF_NAME}-macos-arm64.zip"
          cp LICENSE docs/README.md 2>/dev/null || true
          shasum -a 256 "Tilo-${GITHUB_REF_NAME}-macos-arm64.zip" > "Tilo-${GITHUB_REF_NAME}-macos-arm64.zip.sha256"
        env:
          TILO_QT: ${{ env.QT_ROOT_DIR }}

      - uses: actions/upload-artifact@26f96dfa697d77e81fd5907df203aa23a56210a8 # v4
        with:
          name: ${{ matrix.name }}
          path: |
            dist/*.zip
            dist/*.zip.sha256
            *.zip
            *.zip.sha256
          if-no-files-found: error

  publish:
    name: Publish release assets
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e881e999e38a4c5a1b # v4
        with:
          path: artifacts
      - name: List artifacts
        run: find artifacts -type f | sort
      - uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda # v2
        with:
          draft: true
          fail_on_unmatched_files: false
          files: |
            artifacts/**/*.zip
            artifacts/**/*.sha256